{% macro track_switcher(current_track, endpoint, extra_args={}, show_legacy=true, tracks={}) %}
<div class="btn-group flex-wrap" role="group" aria-label="Track switcher">
    {% for t_key, t_meta in (tracks or {}).items() %}
    <a href="{{ url_for(endpoint, track=t_key, **extra_args) }}"
       class="btn btn-sm {{ 'btn-primary' if current_track == t_key else 'btn-outline-primary' }}">{{ t_meta.label }}</a>
    {% endfor %}
    {% if show_legacy %}
    <a href="{{ url_for(endpoint, track='legacy', **extra_args) }}"
       class="btn btn-sm {{ 'btn-secondary' if current_track == 'legacy' else 'btn-outline-secondary' }}">Legacy</a>
    {% endif %}
</div>
{% endmacro %}
